name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** report security vulnerabilities here. Use a [private advisory](https://github.com/Ankur17nith/skillapt/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: skillapt version
      description: Output of `skillapt --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Node.js version and OS
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran (remove any tokens).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `skillapt doctor`
      render: text
