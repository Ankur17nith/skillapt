name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npx vitest run

      - name: Pack and install smoke test
        run: |
          PACK_DIR="$(mktemp -d)"
          npm pack --ignore-scripts --pack-destination "$PACK_DIR"
          CONSUMER="$(mktemp -d)"
          cd "$CONSUMER"
          npm init -y >/dev/null
          npm install --ignore-scripts "$PACK_DIR"/skillapt-*.tgz
          npx --no-install skillapt --version
          npx --no-install skillapt --help
